name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.shell }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Pester 5 e PSScriptAnalyzer
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      - name: PSScriptAnalyzer
        run: |
          $findings = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Warning, Error
          $findings | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize -Wrap
          if ($findings) { throw "PSScriptAnalyzer encontrou $(@($findings).Count) problema(s)." }

      - name: Pester
        run: |
          Import-Module Pester -RequiredVersion 5.7.1
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = './Tests'
          $cfg.Run.Exit = $true
          $cfg.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $cfg
